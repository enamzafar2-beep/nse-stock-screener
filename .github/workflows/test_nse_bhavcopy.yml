name: Test NSE Full Bhavcopy
on:
  push:
    branches:
      - "test/nse-bhavcopy-download"
    paths-ignore:
      - "nse_daily_history.csv.gz"

permissions:
  contents: write

jobs:
  test-nse-download:
    runs-on: ubuntu-latest
    steps:
      - name: Check out test branch
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pandas requests
      - name: Download and read an actual NSE Full Bhavcopy
        run: python test_nse_bhavcopy.py
      - name: Test historical archive coverage
        run: python test_nse_history_range.py
      - name: Build one-year NSE history database
        run: python build_nse_history.py
      - name: Save database on test branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nse_daily_history.csv.gz
          if git diff --cached --quiet; then
            echo "No database changes to commit."
          else
            git commit -m "Build NSE history database"
            git push origin HEAD:test/nse-bhavcopy-download
          fi
      - name: Save test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nse-bhavcopy-test-output
          path: |
            nse_bhavcopy_test/
            nse_daily_history.csv.gz
          if-no-files-found: warn
