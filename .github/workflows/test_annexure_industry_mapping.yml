name: Test broad Indian equity industry mapping
on:
  push:
    branches:
      - "test/nse-bhavcopy-download"
    paths:
      - "test_annexure_industry_mapping.py"
      - ".github/workflows/test_annexure_industry_mapping.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-industry-coverage:
    runs-on: ubuntu-latest
    steps:
      - name: Check out isolated test branch
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install parsing dependencies
        run: python -m pip install --upgrade pip pandas requests lxml
      - name: Compare company mapping with NSE universe
        run: python test_annexure_industry_mapping.py
      - name: Upload mapping coverage report
        uses: actions/upload-artifact@v4
        with:
          name: annexure-industry-mapping-test
          path: |
            annexure_industry_mapping_test.csv
            annexure_industry_mapping_summary.txt
