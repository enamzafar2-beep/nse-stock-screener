name: Test broad Indian equity industry mapping
on:
  push:
    branches:
      - "test/nse-bhavcopy-download"
    paths:
      - "test_annexure_industry_mapping.py"
      - "apply_manual_industry_overrides.py"
      - "manual_industry_overrides.csv"
      - ".github/workflows/test_annexure_industry_mapping.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-industry-coverage:
    runs-on: ubuntu-latest
    steps:
      - name: Check out isolated test branch
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install parsing dependencies
        run: python -m pip install --upgrade pip pandas requests lxml
      - name: Compare company mapping with NSE universe
        run: python test_annexure_industry_mapping.py
      - name: Apply verified manual classifications
        run: python apply_manual_industry_overrides.py
      - name: Publish complete classification database to test branch
        run: |
          cp annexure_industry_mapping_test.csv /tmp/industry_classification.csv
          git fetch origin "${GITHUB_REF_NAME}"
          git checkout -B "${GITHUB_REF_NAME}" "origin/${GITHUB_REF_NAME}"
          cp /tmp/industry_classification.csv industry_classification.csv
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add industry_classification.csv
          if ! git diff --cached --quiet; then
            git commit -m "Publish reviewed NSE sector and industry classification database"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
      - name: Upload mapping coverage report
        uses: actions/upload-artifact@v4
        with:
          name: annexure-industry-mapping-test
          path: |
            annexure_industry_mapping_test.csv
            annexure_industry_mapping_summary.txt
            annexure_unmapped_name_candidates.csv
            manual_industry_overrides.csv
