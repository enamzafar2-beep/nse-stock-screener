name: Test NSE 59-industry mapping coverage
on:
  push:
    branches:
      - "test/nse-bhavcopy-download"
    paths:
      - "test_nse_industry_mapping.py"
      - ".github/workflows/test_nse_industry_mapping.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-industry-mapping:
    runs-on: ubuntu-latest
    steps:
      - name: Check out isolated test branch
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pandas and requests
        run: python -m pip install --upgrade pip pandas requests
      - name: Test NSE industry mapping coverage
        run: python test_nse_industry_mapping.py
      - name: Upload mapping and coverage report
        uses: actions/upload-artifact@v4
        with:
          name: nse-industry-mapping-test
          path: |
            nse_industry_mapping_test.csv
            nse_industry_mapping_summary.txt
