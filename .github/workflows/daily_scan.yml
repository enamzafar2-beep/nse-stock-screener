name: Daily NSE Stock Scan

"on":
  schedule:
    - cron: "0 11 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Refresh official NSE main-board stock universe
        run: python refresh_universe.py
      - name: Run daily scanner
        run: python app.py
        env:
          NSE_DAILY_SCAN: "1"
      - name: Save daily results and refreshed universe
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add daily_scan_results.csv universe.csv
          git diff --cached --quiet || git commit -m "Update daily NSE scan results and universe"
          git push
