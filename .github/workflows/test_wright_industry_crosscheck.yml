name: Cross-check unmapped NSE industries
on:
  push:
    branches:
      - "test/nse-bhavcopy-download"
    paths:
      - "test_wright_industry_crosscheck.py"
      - ".github/workflows/test_wright_industry_crosscheck.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cross-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out isolated test branch
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install parsing dependencies
        run: python -m pip install --upgrade pip pandas requests lxml beautifulsoup4
      - name: Compare unmapped symbols with Wright directory
        run: python test_wright_industry_crosscheck.py
      - name: Upload cross-check report
        uses: actions/upload-artifact@v4
        with:
          name: wright-industry-crosscheck
          path: |
            wright_industry_crosscheck.csv
            wright_industry_crosscheck_summary.txt
